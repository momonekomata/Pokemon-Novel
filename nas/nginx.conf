server {
  listen 80;
  root /public/site;
  index index.html;
  charset utf-8;
  # The search index is a few MB of text; compressed it's a fraction of that.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location / {
    try_files $uri $uri/ =404;
  }
  # Pages change hourly; make browsers check for a fresh copy.
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }
}
