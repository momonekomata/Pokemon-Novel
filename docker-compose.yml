# Runs the site on a NAS, visible only to devices on your Tailscale network.
# Setup guide: nas/README.md
services:
  # Joins your tailnet as its own device and serves the site at https://<TS_HOSTNAME>.<tailnet>.ts.net
  tailscale:
    image: tailscale/tailscale:latest
    env_file: settings.env # TS_AUTHKEY and TS_HOSTNAME
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - ./nas/serve.json:/config/serve.json:ro
    restart: unless-stopped

  # Serves the built site. Shares the tailscale container's network, so only the tailnet can reach it.
  web:
    image: nginx:alpine
    network_mode: service:tailscale
    volumes:
      - ./public:/public:ro
      - ./nas/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - tailscale
    restart: unless-stopped

  # Pulls chapters and wiki from Google Drive and rebuilds the site on a timer.
  builder:
    image: node:22-alpine
    working_dir: /app
    command: sh /app/nas/run.sh
    env_file: settings.env # AUTHOR_PASSWORD and SYNC_INTERVAL_MINUTES
    volumes:
      - ./:/app
      - ./public:/public
    restart: unless-stopped
